<div id="site-banner" style="display:none;" role="alert" aria-live="polite"></div>

<style>
  :root {
    --site-banner-height: 0px;
  }

  #site-banner {
    position: sticky;
    top: 0;
    z-index: 13;
    width: 100%;
    box-sizing: border-box;
    align-items: center;
    justify-content: center;
    gap: 10px;
    padding: 10px 40px;
    font-size: 14px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  /* Fullpage layout: push sticky topbar below the banner */
  .fullpage-topbar {
    top: var(--site-banner-height);
  }

  #site-banner-message {
    text-align: center;
  }

  #site-banner-message a {
    color: inherit;
    font-weight: 600;
  }

  #site-banner-message strong {
    font-weight: 700;
  }

  #site-banner-message code {
    font-family: monospace;
    padding: 1px 5px;
    border-radius: 3px;
    background: rgba(0, 0, 0, 0.12);
  }

  .site-banner-type-icon {
    font-size: 20px;
    font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 20;
    flex-shrink: 0;
    line-height: 1;
  }

  .site-banner-custom-icon {
    display: flex;
    align-items: center;
    flex-shrink: 0;
  }

  .site-banner-custom-icon svg {
    width: 20px;
    height: 20px;
  }

  #site-banner-close {
    position: absolute;
    right: 8px;
    top: 50%;
    transform: translateY(-50%);
    background: none;
    border: none;
    cursor: pointer;
    color: inherit;
    padding: 4px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
    opacity: 0.7;
    line-height: 1;
    flex-shrink: 0;
  }

  #site-banner-close:hover {
    opacity: 1;
    background: rgba(0, 0, 0, 0.1);
  }

  #site-banner-close .material-symbols-outlined {
    font-size: 18px;
  }
</style>

<script>
(function() {
  var API_URL = 'https://api.moddy.app';
  var banner = document.getElementById('site-banner');

  var TYPE_CFG = {
    announcement: { icon: 'campaign',      bg: 'var(--md-sys-color-secondary-container)', fg: 'var(--md-sys-color-on-secondary-container)' },
    incident:     { icon: 'error',         bg: 'var(--md-sys-color-error-container)',      fg: 'var(--md-sys-color-on-error-container)' },
    maintenance:  { icon: 'construction',  bg: 'var(--md-sys-color-tertiary-container)',   fg: 'var(--md-sys-color-on-tertiary-container)' },
    information:  { icon: 'info',          bg: 'var(--md-sys-color-primary-container)',    fg: 'var(--md-sys-color-on-primary-container)' },
    warning:      { icon: 'warning',       bg: 'var(--md-sys-color-error-container)',      fg: 'var(--md-sys-color-on-error-container)' },
    resolved:     { icon: 'check_circle',  bg: 'var(--md-sys-color-secondary-container)', fg: 'var(--md-sys-color-on-secondary-container)' }
  };

  function safeLink(value) {
    try {
      var url = new URL(value, window.location.origin);
      return url.protocol === 'https:' || url.protocol === 'http:' ? url.href : null;
    } catch (_) {
      return null;
    }
  }

  function renderMessage(element, text) {
    var source = String(text || '');
    var token = /(\*\*([^*]+)\*\*|\*([^*]+)\*|`([^`]+)`|\[([^\]]+)\]\(([^)\s]+)\))/g;
    var cursor = 0;
    var match;

    element.replaceChildren();
    while ((match = token.exec(source)) !== null) {
      element.appendChild(document.createTextNode(source.slice(cursor, match.index)));
      var node;
      if (match[2] !== undefined) {
        node = document.createElement('strong');
        node.textContent = match[2];
      } else if (match[3] !== undefined) {
        node = document.createElement('em');
        node.textContent = match[3];
      } else if (match[4] !== undefined) {
        node = document.createElement('code');
        node.textContent = match[4];
      } else {
        var href = safeLink(match[6]);
        if (href) {
          node = document.createElement('a');
          node.href = href;
          node.target = '_blank';
          node.rel = 'noopener noreferrer';
          node.textContent = match[5];
        } else {
          node = document.createTextNode(match[5]);
        }
      }
      element.appendChild(node);
      cursor = token.lastIndex;
    }
    element.appendChild(document.createTextNode(source.slice(cursor)));
  }

  function renderSafeSvg(element, source) {
    if (typeof source !== 'string' || source.length > 20000) return false;

    var allowedTags = new Set([
      'svg', 'g', 'path', 'circle', 'ellipse', 'line', 'polyline', 'polygon',
      'rect', 'title', 'desc'
    ]);
    var allowedAttributes = new Set([
      'viewBox', 'width', 'height', 'x', 'y', 'x1', 'x2', 'y1', 'y2', 'cx',
      'cy', 'r', 'rx', 'ry', 'd', 'points', 'fill', 'fill-rule', 'stroke',
      'stroke-width', 'stroke-linecap', 'stroke-linejoin', 'opacity',
      'transform', 'role', 'aria-hidden', 'focusable'
    ]);

    try {
      var parsed = new DOMParser().parseFromString(source, 'image/svg+xml');
      var root = parsed.documentElement;
      if (root.localName !== 'svg' || parsed.querySelector('parsererror')) return false;

      function cloneSafe(node) {
        if (node.nodeType === Node.TEXT_NODE) {
          return document.createTextNode(node.textContent || '');
        }
        if (node.nodeType !== Node.ELEMENT_NODE || !allowedTags.has(node.localName)) {
          return null;
        }

        var copy = document.createElementNS('http://www.w3.org/2000/svg', node.localName);
        for (var i = 0; i < node.attributes.length; i++) {
          var attribute = node.attributes[i];
          var isExternalPaint =
            (attribute.name === 'fill' || attribute.name === 'stroke') &&
            attribute.value.toLowerCase().includes('url(');
          if (allowedAttributes.has(attribute.name) && !isExternalPaint) {
            copy.setAttribute(attribute.name, attribute.value);
          }
        }
        for (var j = 0; j < node.childNodes.length; j++) {
          var child = cloneSafe(node.childNodes[j]);
          if (child) copy.appendChild(child);
        }
        return copy;
      }

      var safeRoot = cloneSafe(root);
      if (!safeRoot) return false;
      element.replaceChildren(safeRoot);
      return true;
    } catch (_) {
      return false;
    }
  }

  function hideBanner() {
    banner.style.display = 'none';
    document.documentElement.style.setProperty('--site-banner-height', '0px');
  }

  function render(data) {
    if (!data || !data.show_website) { hideBanner(); return; }
    if (sessionStorage.getItem('site-banner-dismissed') === String(data.id)) { hideBanner(); return; }

    banner.style.borderLeft = '';
    banner.replaceChildren();

    var iconEl = document.createElement('span');
    var messageEl = document.createElement('div');
    messageEl.id = 'site-banner-message';
    messageEl.className = 'site-banner-message';

    if (data.type) {
      var cfg = TYPE_CFG[data.type] || TYPE_CFG.information;
      banner.style.backgroundColor = cfg.bg;
      banner.style.color = cfg.fg;
      iconEl.className = 'material-symbols-outlined site-banner-type-icon';
      iconEl.setAttribute('aria-hidden', 'true');
      iconEl.textContent = cfg.icon;
    } else {
      var accent = data.color || 'var(--md-sys-color-primary)';
      banner.style.backgroundColor = 'var(--md-sys-color-surface-container)';
      banner.style.color = 'var(--md-sys-color-on-surface)';
      banner.style.borderLeft = '4px solid ' + accent;
      if (data.icon_svg) {
        iconEl.className = 'site-banner-custom-icon';
        iconEl.style.color = accent;
        iconEl.setAttribute('aria-hidden', 'true');
        renderSafeSvg(iconEl, data.icon_svg);
      }
    }

    renderMessage(messageEl, data.message);

    var closeBtn = document.createElement('button');
    closeBtn.id = 'site-banner-close';
    closeBtn.setAttribute('aria-label', 'Fermer le bandeau');
    var closeIcon = document.createElement('span');
    closeIcon.className = 'material-symbols-outlined';
    closeIcon.setAttribute('aria-hidden', 'true');
    closeIcon.textContent = 'close';
    closeBtn.appendChild(closeIcon);
    closeBtn.addEventListener('click', function() {
      sessionStorage.setItem('site-banner-dismissed', String(data.id));
      hideBanner();
    });

    if (iconEl.hasChildNodes() || iconEl.textContent) banner.appendChild(iconEl);
    banner.appendChild(messageEl);
    banner.appendChild(closeBtn);
    banner.style.display = 'flex';

    requestAnimationFrame(function() {
      document.documentElement.style.setProperty('--site-banner-height', banner.offsetHeight + 'px');
    });
  }

  function fetchBanner() {
    fetch(API_URL + '/banners/active')
      .then(function(r) { return r.json(); })
      .then(render)
      .catch(function() {});
  }

  fetchBanner();
  setInterval(fetchBanner, 60000);
})();
</script>
