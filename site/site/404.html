name: Page Not Found
title: 404
layout: layouts/fullpage.html
hasToc: false
permalink: 404.html
---

<script type="module" src="/js/hydration-entrypoints/circular-progress.js"></script>

<style>
  #redirect-checking {
    display: flex;
    justify-content: center;
    align-items: center;
    position: fixed;
    inset: 0;
  }

  #redirect-checking md-circular-progress {
    --md-circular-progress-size: 48px;
    --md-circular-progress-active-indicator-color: var(--md-sys-color-primary);
  }

  #error-content {
    display: none;
  }

  .error-container {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    text-align: center;
    padding: 24px;
  }

  .error-code {
    font-size: 96px;
    font-weight: 700;
    line-height: 1;
    letter-spacing: -3px;
    color: var(--md-sys-color-primary);
    -webkit-font-smoothing: antialiased;
  }

  .error-title {
    font-size: 24px;
    font-weight: 600;
    color: var(--md-sys-color-on-surface);
    margin: 0;
    -webkit-font-smoothing: antialiased;
  }

  .error-desc {
    font-size: 15px;
    color: var(--md-sys-color-on-surface-variant);
    margin: 0 0 8px;
    line-height: 1.5;
  }

  @media (max-width: 480px) {
    .error-code {
      font-size: 64px;
      letter-spacing: -2px;
    }

    .error-title {
      font-size: 20px;
    }
  }
</style>

<div id="redirect-checking">
  <md-circular-progress indeterminate></md-circular-progress>
</div>

<div id="error-content">
  <lit-island on:visible import="/js/hydration-entrypoints/form-controls.js">
    <div class="error-container">
      <span class="error-code">404</span>
      <h1 class="error-title">Page not found</h1>
      <p class="error-desc">The page you&#39;re looking for doesn&#39;t exist.</p>
      <md-filled-button href="/">Go home</md-filled-button>
    </div>
  </lit-island>
</div>

<script>
(function() {
  function show404() {
    document.getElementById('redirect-checking').style.display = 'none';
    document.getElementById('error-content').style.display = 'block';
  }

  var timeout = setTimeout(show404, 5000);

  var path = window.location.pathname;

  fetch(
    'https://api.moddy.app/redirects/lookup?domain=moddy.app&path=' + encodeURIComponent(path),
    { signal: AbortSignal.timeout(5000) }
  )
    .then(function(r) { return r.json(); })
    .then(function(data) {
      clearTimeout(timeout);
      if (!data || typeof data.target !== 'string' || !data.target) {
        show404();
        return;
      }

      try {
        var target = new URL(data.target, window.location.origin);
        if (target.protocol !== 'https:' && target.protocol !== 'http:') {
          show404();
          return;
        }
        window.location.replace(target.href);
      } catch (_) {
        show404();
      }
    })
    .catch(function() {
      clearTimeout(timeout);
      show404();
    });
})();
</script>
